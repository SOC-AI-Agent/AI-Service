# The AI service: the backend's door to the agent platform, and the playbook index.
#
#   cp .env.example .env      then set AI_SERVICE_AUTH_TOKEN (same as Backend/.env)
#   docker compose up -d --build
#
# No database, no queue, no job state. It hands a rendered prompt to the LLM
# server and returns what the agent answered, and it keeps one thing: the
# playbook index the backend builds by sending it the Confluence pages.
#
# Needs soc-llm-server on soc-network. It starts without it; /health reports
# the LLM server as unreachable and /analyze fails with a message naming it,
# rather than the container refusing to come up.

services:
  soc-ai:
    build: .
    container_name: soc-ai
    # No ports. Only the backend calls this, over soc-network, and every route
    # but /health wants the bearer token. Published on the host it was a way
    # for anything on the company network to run agents on the one model slot
    # the SOC's alerts queue for.
    env_file: [.env]
    volumes:
      # The playbook index. A restart loads it instead of embedding every page again.
      - playbook-index:/data
    restart: unless-stopped
    networks: [soc-network]

volumes:
  playbook-index:

networks:
  # One network, shared by all five repos' stacks and named explicitly so it is
  # `soc-network` rather than `<project>_soc-network`. Whichever comes up first
  # creates it; the rest join it and reach each other by container name.
  soc-network:
    name: soc-network
    driver: bridge
