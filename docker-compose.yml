# The AI service: the backend's door to the agent platform.
#
#   cp .env.example .env
#   docker compose up -d --build
#
# Stateless — no database, no queue, no job state. It takes a rendered prompt,
# hands it to the LLM server, and returns what the agent answered.
#
# Needs soc-llm-server on soc-network. It starts without it; /health reports
# the LLM server as unreachable and /analyze fails with a message naming it,
# rather than the container refusing to come up.

services:
  soc-ai:
    build: .
    container_name: soc-ai
    ports: ["8100:8100"]
    env_file: [.env]
    restart: unless-stopped
    networks: [soc-network]

networks:
  # One network, shared by all five repos' stacks and named explicitly so it is
  # `soc-network` rather than `<project>_soc-network`. Whichever comes up first
  # creates it; the rest join it and reach each other by container name.
  soc-network:
    name: soc-network
    driver: bridge
