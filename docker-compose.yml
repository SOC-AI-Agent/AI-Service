# The AI service: the backend's door to the agent platform, and the playbook index.
#
#   cp .env.example .env      then set AI_SERVICE_AUTH_TOKEN (same as Backend/.env)
#   docker compose up -d --build
#
# No database, no queue, no job state. It hands a rendered prompt to the agent
# platform and returns what the agent answered, and it keeps one thing: the
# playbook index the backend builds by sending it the Confluence pages.
#
# Needs Agent-Server (../Agent-Server, LLM_SERVER_URL in .env). It starts
# without it; /health reports it unreachable and /analyze fails with a message
# naming it, rather than the container refusing to come up. Agent-Server is not
# on soc-network — it is its own stack, reached by URL like Splunk/ThreatQ/
# Confluence are — so nothing here waits on it or joins its network.

services:
  soc-ai:
    build: .
    container_name: soc-ai
    # No ports. Only the backend calls this, over soc-network, and every route
    # but /health wants the bearer token. Published on the host it was a way
    # for anything on the company network to run agents on the one model slot
    # the SOC's alerts queue for.
    env_file: [.env]
    environment:
      # The server below, unless .env names another one.
      QDRANT_URL: ${QDRANT_URL:-http://soc-qdrant:6333}
    volumes:
      # The playbook index. A restart loads it instead of embedding every page again.
      - playbook-index:/data
    # Lets LLM_SERVER_URL=http://host.docker.internal:8001 reach Agent-Server's
    # published port when it runs via its own compose on this same machine.
    # Docker Desktop resolves host.docker.internal without this; Linux needs it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [soc-qdrant]
    restart: unless-stopped
    networks: [soc-network]

  # The vector database behind playbook matching and search (QDRANT_URL in
  # .env). No ports: only soc-ai reads it. If it is down, matching by use case
  # id and by name carry on, and /playbooks says why matching by meaning is off;
  # on a fresh volume soc-ai re-embeds the playbooks it has on file.
  soc-qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: soc-qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks: [soc-network]

volumes:
  playbook-index:
  qdrant-data:

networks:
  # Shared by AI-service/Backend/Frontend/MCP-Server's stacks, reached by
  # container name. Created once, outside any one project (`docker network
  # create soc-network`) — external here so this project doesn't believe it
  # owns and can tear down a network the others are still using.
  soc-network:
    external: true
    name: soc-network
