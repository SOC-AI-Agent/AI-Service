# AI-Service — the backend's door to the agent platform, and the playbook index.
#
# No database, no queue, no job state; the playbook index lives on its own
# volume and survives a rebuild. A deploy is a rebuild and a health check.
#
# AI_SERVICE_AUTH_TOKEN must be set as a CI variable, byte-identical to the one
# the Backend project gets — a group variable, not one per project. Without it
# the service refuses to start and the health check below fails the deploy.
#
# The image build downloads CPU torch (download.pytorch.org) and the embedding
# model (huggingface.co). The runner that builds it needs to reach both; the
# running container reaches neither.

stages:
  - build
  - test
  - inspect
  - deploy

# The office proxy, the runner host's only way to the internet. A CI/CD
# variable of the same name overrides this; an empty one turns the proxy off.
variables:
  BUILD_PROXY: "http://192.168.137.120:8080"


# ── Reusable: write .env from CI variables ──────────────────────────────────
#
# Not sed. A password containing | or / breaks the expression, and one
# containing & is silently replaced by the matched text — the pipeline goes
# green and the service cannot log in. This reads the keys from .env.example
# and takes any that exist in the environment, whatever characters they hold.
#
# The result is never an artifact and never printed. The monorepo's job did
# both: `artifacts: paths: [.env]` put filled-in production credentials in
# GitLab's artifact store for a week, downloadable by anyone with project
# access, and `cat .env | grep -v PASSWORD | grep -v SECRET | grep -v URL`
# printed everything else — including MCP_AUTH_TOKEN, SPLUNK_TOKEN,
# THREATQ_TOKEN and CONFLUENCE_API_TOKEN, none of which contain those words.
.write_env: &write_env |
  set -eu
  : > .env
  while IFS= read -r line || [ -n "$line" ]; do
    case "$line" in
      ''|'#'*) printf '%s\n' "$line" >> .env; continue ;;
    esac
    key=${line%%=*}
    if [ "$key" = "$line" ]; then printf '%s\n' "$line" >> .env; continue; fi
    if eval "[ \"\${${key}+set}\" = set ]"; then
      eval "printf '%s=%s\n' \"\$key\" \"\$$key\"" >> .env
    else
      printf '%s\n' "$line" >> .env
    fi
  done < .env.example
  echo "wrote .env — keys taken from CI variables:"
  # Names only. The values are the point of the exercise.
  while IFS= read -r line; do
    key=${line%%=*}
    case "$key" in ''|'#'*) continue ;; esac
    if eval "[ \"\${${key}+set}\" = set ]"; then echo "  $key"; fi
  done < .env.example

# ── Reusable: the office proxy ──────────────────────────────────────────────
#
# Without it apt, npm, pip and prisma time out on the runner host ("Unable to
# locate package"). Exported for the npm/pip a job runs itself, and handed to
# `docker build` / `docker compose build` as PROXY_ARGS: a build does not
# inherit the job's environment. These are Docker's predefined proxy build
# args — no ARG line needed in any Dockerfile, and they stay out of the image's
# history. Both spellings, because apt reads only the lowercase ones. Set inside
# the script, after the checkout, so `git clone` never goes through the proxy.
.proxy: &proxy |
  p="${BUILD_PROXY:-}"
  np="localhost,127.0.0.1"
  export http_proxy="$p" https_proxy="$p" HTTP_PROXY="$p" HTTPS_PROXY="$p" \
         no_proxy="$np" NO_PROXY="$np"
  PROXY_ARGS="--build-arg http_proxy=$p --build-arg https_proxy=$p --build-arg HTTP_PROXY=$p --build-arg HTTPS_PROXY=$p --build-arg no_proxy=$np --build-arg NO_PROXY=$np"
  if [ -n "$p" ]; then echo "proxy: on"; else echo "proxy: off (BUILD_PROXY is empty)"; fi

build_image:
  stage: build
  image: docker:latest
  tags:
    - llm
  # Builds on the runner host's own Docker daemon, through the socket the llm
  # runner mounts — no docker:dind. One fixed tag, overwritten each run: the
  # host is the production machine, and an image per commit would pile up on
  # its disk.
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  script:
    - *proxy
    - docker build $PROXY_ARGS -t soc-ai:ci .
  rules:
    - if: '$CI_COMMIT_BRANCH'

code_test:
  stage: test
  image: python:3.12
  tags:
    - llm
  script:
    - *proxy
    - pip install -q -r requirements.txt -r tests/requirements.txt
    # A throwaway token: main refuses to import without one, which is the point.
    - AI_SERVICE_AUTH_TOKEN=ci-throwaway python -c "import main"
    # The playbook index and the auth gate, with a stand-in embedder — no torch,
    # no model download.
    - pytest -q
    # The SSE reader is this service's whole job, and its failures are quiet.
    # A terminal event carrying empty text once left status="started" in place,
    # which turned a model timeout into a complaint about parsing.
    - |
      python - <<'PY'
      from services import sse
      def run(events):
          r = sse.StreamReader()
          for e in events:
              r.feed_line('data: ' + e); r.feed_line('')
          r.close(); return r
      ok = run(['{"status":"started"}','{"message":{"content":"hi"}}',
                '{"output":"hi there","status":"completed"}'])
      assert ok.output == 'hi there', ok.output
      bad = run(['{"status":"started"}','{"output":"","status":"failed","error":"timed out"}'])
      assert bad.meta.get('status') == 'failed', bad.meta
      assert bad.meta.get('error') == 'timed out', bad.meta
      print('sse reader ok')
      PY
  rules:
    - if: '$CI_COMMIT_BRANCH'

# Which host ports the SOC stack publishes on this machine and what holds each
# one, this host's addresses, and its packet filter. Read-only
# (scripts/inspect-ports.sh, the same file as Backend's scripts/inspect-ports.sh). For a
# port that answers on the host but times out from a browser, it shows whether
# this host drops the packets or the network between does. By itself on main,
# before deploy_production; a button (▶) on other protected branches. Never
# stops a pipeline.
inspect_ports:
  stage: inspect
  image: docker:latest
  tags:
    - llm
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  # Reads production without deploying to it; whoever may deploy to the
  # protected "production" environment is who may run this.
  environment:
    name: production
    action: access
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      allow_failure: true
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  script:
    - sh scripts/inspect-ports.sh

deploy_production:
  stage: deploy
  image: docker:latest
  # The only job that needs a specific runner. DOCKER_HOST points at the
  # socket of the machine this runs on, so the runner *is* the deployment
  # target — a shared runner would build the stack inside a throwaway
  # container and take it away again.
  tags:
    # `llm` is the production runner: the one installed on the machine that
    # hosts the stack, so the runner IS the deployment target. Every job in
    # this file runs on it — a docker executor with the host's
    # /var/run/docker.sock mounted. The `test` runner is a shell executor with
    # no docker, so nothing here uses it.
    - llm
  variables:
    # The socket of the machine this runner is on: the deployment target.
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  environment:
    name: production
    # The address GitLab shows and links to. It is where the service actually
    # answers, so it comes from a variable — localhost here would be a link to
    # the runner, which is not where anyone reads this from.
    url: '$AI_SERVICE_URL'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - *write_env
    - echo "========== Build and start =========="
    # soc-network is external (see docker-compose.yml) — shared with
    # Backend/Frontend/MCP-Server's deploys, all on this same production
    # runner/host. Whichever of the four deploys first, creates it; idempotent
    # so the other three deploying in any order or any number of times is fine.
    - docker network create soc-network 2>/dev/null || true
    - *proxy
    - docker compose build $PROXY_ARGS
    - docker compose up -d --wait
    - echo "========== Health =========="
    # localhost here is the container's own loopback, reached through
    # docker compose exec — not the runner's. It is the right address
    # for asking a service whether it came up.
    # /health reports whether the LLM server is reachable, so this catches a
    # deploy that came up pointing at nothing.
    - |
      healthy=""
      for i in $(seq 1 20); do
        if docker compose exec -T soc-ai python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health',timeout=5).status==200 else 1)" 2>/dev/null; then
          healthy=yes; break
        fi
        sleep 3
      done
      if [ -z "$healthy" ]; then
        echo "soc-ai did not become healthy"; docker compose logs --tail 40 soc-ai; exit 1
      fi
      echo "healthy inside the container"

    - echo "========== Address =========="
    # Not published on this host: only the Backend calls it, over soc-network,
    # at soc-ai:8100 (the Backend's AI_SERVICE_URL), with the bearer token. So
    # /health is asked from a throwaway container on soc-network, the way the
    # Backend asks — and its answer says where this service looks for
    # Agent-Server (LLM_SERVER_URL) and whether that answered. Agent-Server not
    # answering is reported, not fatal: it may simply deploy after this.
    - |
      url="http://soc-ai:8100"
      echo "AI-Service    $url   (soc-network only, not published on this host)"
      echo "Backend uses  AI_SERVICE_URL=$url"
      if ! answer=$(docker run --rm --network soc-network --entrypoint wget "$CI_JOB_IMAGE" -qO- -T 15 "$url/health"); then
        echo "$url/health does not answer on soc-network: the Backend cannot reach this service."
        exit 1
      fi
      echo "  answers on soc-network"
      llm_url=$(printf '%s' "$answer" | sed -nE 's/.*"llm_server_url": ?"([^"]*)".*/\1/p')
      llm_up=$(printf '%s' "$answer" | sed -nE 's/.*"llm_server": ?(true|false).*/\1/p')
      if [ "$llm_up" = true ]; then
        echo "Agent-Server  $llm_url   answers"
      else
        echo "Agent-Server  $llm_url   does NOT answer — agent calls fail until it does"
        echo "              (Agent-Server's deploy prints the LLM_SERVER_URL to use)"
      fi
